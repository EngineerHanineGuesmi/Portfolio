<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the `--base-href` argument given to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hanine Guesmi, Mobile Engineer. I build apps with Flutter and native Android.">
  <meta name="theme-color" content="#121212">

  <!-- Link previews (WhatsApp, LinkedIn, Instagram...) -->
  <meta property="og:title" content="Hanine Guesmi | Mobile Engineer">
  <meta property="og:description" content="I build apps with Flutter and native Android.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hanine Guesmi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hanine Guesmi | Mobile Engineer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Start downloading the engine and main fonts right away, in parallel with the app code -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Poppins/Poppins-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Poppins/Poppins-Medium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Poppins/Poppins-Bold.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #121212; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #121212; color: #E6E6E6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash .logo { font-size: 40px; font-weight: 700; color: #7C4DFF; letter-spacing: 1px; }
    #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: #2a2a2a; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #7C4DFF; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
    @media (prefers-color-scheme: light) {
      html, body, #splash { background: #F8F9FF; }
      #splash { color: #1A1A2E; }
      #splash .bar { background: #e2e2f0; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <div class="logo">HG</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
