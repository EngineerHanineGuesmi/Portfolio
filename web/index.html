<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the `--base-href` argument given to `flutter build`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hanine Guesmi, Mobile Engineer. I build apps with Flutter and native Android.">
  <meta name="theme-color" content="#120E11">

  <!-- Link previews (WhatsApp, LinkedIn, Instagram...) -->
  <meta property="og:title" content="Hanine Guesmi | Mobile Engineer">
  <meta property="og:description" content="I build apps with Flutter and native Android.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hanine Guesmi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Hanine Guesmi | Mobile Engineer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Open connections to the engine and font servers early, in parallel with the app code -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    html, body { margin: 0; height: 100%; background: #120E11; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #120E11; color: #EDE3E6;
      font-family: Georgia, "Times New Roman", serif;
      transition: opacity .35s ease;
    }
    #splash .logo { font-size: 40px; font-weight: 700; color: #E2829B; letter-spacing: 1px; }
    #splash .bar { width: 140px; height: 3px; border-radius: 3px; background: #2a2226; overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #E2829B; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading">
    <div class="logo">HG</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
